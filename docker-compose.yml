version: '3.8'

services:
  api-gateway:
    build:
      context: ./services/api_gateway
      dockerfile: Dockerfile
    container_name: glitch-api-gateway
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: glitch-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

