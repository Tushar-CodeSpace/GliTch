version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glitch-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  scraper-agent:
    build:
      context: ./services/scraper_agent
      dockerfile: Dockerfile
    container_name: glitch-scraper-agent
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glitch-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - scraper-agent
    restart: unless-stopped
