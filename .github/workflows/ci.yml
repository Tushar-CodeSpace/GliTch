name: Glitch CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
      - 'major/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1. Branch Naming & Semantic Versioning Resolution
  # --------------------------------------------------------------------------
  version-check:
    name: Resolve SemVer from Branch
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.semver.outputs.version }}
      bump_type: ${{ steps.semver.outputs.bump_type }}
      branch_name: ${{ steps.semver.outputs.branch_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Calculate Semantic Version
        id: semver
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Evaluating branch: $BRANCH"

          # Validate branch naming convention
          node scripts/version.mjs --branch "$BRANCH" --validate

          # Calculate next SemVer
          NEXT_VER=$(node scripts/version.mjs --branch "$BRANCH" --next)
          BUMP=$(node scripts/version.mjs --branch "$BRANCH" --json | jq -r '.bumpType')

          echo "Target SemVer: $NEXT_VER (Bump strategy: $BUMP)"
          echo "version=$NEXT_VER" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # 2. Go Backend & SQLite Database Automated Tests
  # --------------------------------------------------------------------------
  daemon-tests:
    name: Go Backend & SQLite (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', '1.27']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Run Go Unit & Integration Tests
        working-directory: services/daemon
        run: |
          go test -v ./...

      - name: Compile Native Binary
        working-directory: services/daemon
        run: |
          go build -v -o ../../bin/glitch-daemon .

  # --------------------------------------------------------------------------
  # 3. Web UI Typecheck & Production Build
  # --------------------------------------------------------------------------
  web-build:
    name: Web Frontend Build & Typecheck
    runs-on: ubuntu-24.04
    needs: [version-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install Web Dependencies
        working-directory: packages/web
        run: |
          npm ci

      - name: TypeScript Check & Vite Production Build
        working-directory: packages/web
        run: |
          npm run build

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glitch-web-dist-${{ needs.version-check.outputs.semver }}
          path: packages/web/dist
          retention-days: 7

  # --------------------------------------------------------------------------
  # 4. Installer Script Smoke Tests (Linux & macOS)
  # --------------------------------------------------------------------------
  installer-smoke-test:
    name: Installer Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Test Installer Help Flag
        run: |
          ./install.sh --help

      - name: Execute Full Installer (Fast Smoke Test)
        run: |
          ./install.sh --no-build

      - name: Verify CLI Commands & Updater
        run: |
          ./bin/glitch --version
          ./bin/glitch db
          ./bin/glitch triage
          ./bin/glitch status
          ./bin/glitch-update --help

  # --------------------------------------------------------------------------
  # 5. Debian Package (.deb) Build with Branch SemVer
  # --------------------------------------------------------------------------
  package-deb:
    name: Build Debian Package (.deb)
    runs-on: ubuntu-24.04
    needs: [version-check, daemon-tests, web-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install Web Dependencies
        working-directory: packages/web
        run: |
          npm ci

      - name: Build Debian Package with Branch SemVer
        run: |
          ./scripts/build-deb.sh "${{ needs.version-check.outputs.semver }}"

      - name: Verify Package Contents & Architecture
        run: |
          dpkg-deb -I "dist/glitch_${{ needs.version-check.outputs.semver }}_all.deb"
          dpkg-deb -c "dist/glitch_${{ needs.version-check.outputs.semver }}_all.deb" | grep "etc/apt/apt.conf.d/99glitch-update"

      - name: Upload Debian Package (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: glitch-debian-${{ needs.version-check.outputs.semver }}
          path: "dist/glitch_${{ needs.version-check.outputs.semver }}_all.deb"
          retention-days: 14
