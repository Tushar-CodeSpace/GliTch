name: GliTch CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Test API Gateway with uv
  test-api-gateway:
    name: Test FastAPI API Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/api_gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  # 2. Validate Edge Site Agent
  test-glitch-agent:
    name: Validate Edge Site Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/glitch_agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

  # 3. Build Frontend
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './services/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build static bundle
        run: npm run build

  # 3. Build & Push Docker Images to GitHub Container Registry (GHCR)
  build-and-push-docker:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [test-api-gateway, test-glitch-agent, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner Name
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api_gateway
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/glitch-api-gateway:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/glitch-api-gateway:${{ github.sha }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/glitch-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/glitch-frontend:${{ github.sha }}

  # 4. Deploy Pre-built Docker Containers to EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /opt/glitch
            cd /opt/glitch
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml -o docker-compose.yml
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f