[project]
name = "glitch-api-gateway"
version = "0.1.0"
description = "FastAPI API Gateway managed with uv for GliTch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
